<body>
<p>Die Abfahrtskontrolle ist umgezogen.<br><a href="https://milo-reisen.de/abfahrtskontrolle/">Zur App auf milo-reisen.de</a></p>
<script>
/* Früher hier installierte App: Zwischenspeicher leeren und zur Webseite wechseln */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
}
if (window.caches) { caches.keys().then(ks => ks.forEach(k => k.indexOf('mak-gh-') === 0 && caches.delete(k))).catch(() => {}); }
location.replace('https://milo-reisen.de/abfahrtskontrolle/');
</script>
</body>
