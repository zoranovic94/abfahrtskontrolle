<body>
<div id="splash" class="splash" aria-hidden="true">
  <div class="sp-in">
    <div class="sp-emblem"><img src="logo/emblem-512.png" width="512" height="512" alt=""><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47.6"/></svg></div>
    <picture><source srcset="logo/schriftzug-hell.png" media="(prefers-color-scheme: dark)"><img class="sp-schrift" src="logo/schriftzug.png" width="1444" height="162" alt=""></picture>
    <div class="tafel sp-tafel"><div class="tf-zeile"><span>Abfahrtskontrolle</span></div></div>
  </div>
</div>

<header class="band" id="kopf">
  <div class="band-in">
    <div class="marke">
      <img src="logo/emblem-256.png" width="40" height="40" alt="">
      <div><b>Abfahrtskontrolle</b><small id="firma">Milo Reisen</small></div>
    </div>
    <button type="button" class="wer" id="wer" data-view="profil" aria-label="Profil öffnen" hidden></button>
  </div>
  <div class="offline" id="offline" hidden>Keine Internetverbindung – Eingaben bleiben auf dem Handy, gespeichert wird, sobald wieder Netz da ist.</div>
</header>

<main id="main">
  <div class="start" id="start"></div>
  <section class="view" id="v-start" hidden></section>
  <section class="view" id="v-meine" hidden></section>
  <section class="view" id="v-fs" hidden></section>
  <section class="view" id="v-profil" hidden></section>
  <section class="view" id="v-uebersicht" hidden></section>
  <section class="view" id="v-maengel" hidden></section>
  <section class="view" id="v-fahrzeuge" hidden></section>
  <section class="view" id="v-fahrer" hidden></section>
</main>

<nav class="dock" id="tabs" aria-label="Bereiche" hidden></nav>
<section class="flow" id="v-neu" aria-label="Abfahrtskontrolle" hidden></section>

<div id="modal" class="modal" hidden><div class="m-panel" role="dialog" aria-modal="true" aria-labelledby="mTitel" id="mInhalt"></div></div>

<div id="login" class="login" hidden>
  <form id="lgForm" class="lg-karte">
    <div class="lg-logo">
      <img class="lg-emblem" src="logo/emblem-256.png" width="256" height="256" alt="">
      <picture><source srcset="logo/schriftzug-hell.png" media="(prefers-color-scheme: dark)"><img class="lg-schrift" src="logo/schriftzug.png" width="1444" height="162" alt="Milo Reisen"></picture>
    </div>
    <div class="tafel lg-tafel"><div class="tf-zeile"><span>Abfahrtskontrolle</span><span class="tf-uhr" data-uhr></span></div></div>
    <p id="lgHinweis" class="hinweis" hidden></p>
    <label class="feld"><span>Name</span><input id="lgName" name="username" autocomplete="username" autocapitalize="words" required></label>
    <label class="feld"><span>PIN</span><input id="lgPin" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" required></label>
    <p id="lgFehler" class="fehler" role="alert"></p>
    <button class="haupt breit" id="lgBtn" type="button" data-absenden>Anmelden</button>
    <p class="mute klein">Name und PIN bekommst du von der Disposition.</p>
    <div class="install" id="installLogin" hidden></div>
  </form>
</div>
